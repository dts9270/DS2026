<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>क्रांतिकारी वर्ष 2026</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #000080; --saffron: #FF9933; --green: #138808;
            --card-bg: rgba(255, 255, 255, 0.98);
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #FF9933 0%, #ffffff 50%, #138808 100%);
            background-attachment: fixed; min-height: 100vh; padding-bottom: 50px;
        }
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 9999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        .app-header {
            background: rgba(255, 255, 255, 0.95); padding: 15px 0; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); margin-bottom: 15px; border-radius: 0 0 20px 20px;
        }
        .mini-stat-card {
            background: white; border-radius: 12px; padding: 10px; text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-bottom: 4px solid #ddd;
        }
        .border-blue { border-bottom-color: var(--primary); color: var(--primary); }
        .border-saffron { border-bottom-color: var(--saffron); color: var(--saffron); }
        .border-green { border-bottom-color: var(--green); color: var(--green); }
        
        .custom-card { 
            background: var(--card-bg); border-radius: 16px; border: none; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); margin-bottom: 20px; 
        }
        
        /* BIGGER INPUTS STYLE */
        .form-label { font-weight: 600; color: #444; margin-bottom: 2px; }
        .form-control, .form-select { 
            padding: 10px; font-size: 16px; border-radius: 8px; /* Big Inputs */
            border: 1px solid #ccc;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,0,128,0.1); }

        .btn-custom { padding: 10px; font-size: 16px; font-weight: bold; border-radius: 8px; color: white; border: none; }
        
        .nav-pills-custom .nav-link { 
            padding: 8px 15px; font-size: 1rem; margin: 0 5px; 
            background: white; color: var(--primary); font-weight: 600; 
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .nav-pills-custom .nav-link.active { background: var(--primary); color: white; transform: scale(1.05); }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner-border text-primary" role="status"></div>
    <b class="mt-2 text-primary">Loading...</b>
</div>

<header class="app-header">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h4 class="mb-0 fw-bold text-primary" style="text-transform: uppercase;"><i class="fas fa-flag-checkered text-danger"></i> क्रांतिकारी वर्ष 2026</h4>
            <small class="text-dark fw-bold">Deepak Shengule | Mission</small>
        </div>
        <span class="badge bg-white text-dark border p-2 rounded-pill shadow-sm" id="statusBadge">🔴 Connecting...</span>
    </div>
</header>

<div class="container">
    
    <div id="reminderSection" class="alert alert-danger shadow-sm mb-3" style="display:none;">
        <strong><i class="fas fa-bell"></i> रिमांइडर्स:</strong> <div id="reminderList" class="mt-1"></div>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-4"><div class="mini-stat-card border-blue"><h3 id="topTotal">0</h3><small>Total List</small></div></div>
        <div class="col-4"><div class="mini-stat-card border-saffron"><h3 id="topFollow">0</h3><small>FollowUps</small></div></div>

        <li class="nav-item"><button class="nav-link" onclick="switchProject('anemia')">ॲनिमिया</button></li>

        <li class="nav-item"><button class="nav-link" onclick="switchProject('network')">नेटवर्क</button></li>

    <div id="contentArea">

                            <div class="col-12 bg-light p-3 rounded border border-primary">

                                <select id="importSelect" class="form-select mt-1" onchange="fillFromImport()">

                                </select>
                            </div>

                            <div class="col-12">

                    <div class="custom-card">

                <div class="tab-pane fade" id="sub-followup">
                    <div class="custom-card p-4 border-top border-4 border-warning">
                        <label class="form-label">व्यक्ती निवडा:</label>
                        <select id="followupPersonSelect" class="form-select mb-3"></select>
                        
                        <label class="form-label">चर्चा (Remark):</label>
                        <textarea id="fRemark" class="form-control mb-3" rows="2" placeholder="आज काय बोलणे झाले..."></textarea>
                        
                        <label class="form-label text-primary fw-bold">पुढील ३ तारखा (Next 3 Reminders):</label>
                        <div class="d-flex gap-2 mb-3">
                            <input type="date" id="fDate1" class="form-control">
                            <input type="date" id="fDate2" class="form-control">
                            <input type="date" id="fDate3" class="form-control">
                        </div>
                        <button class="btn btn-custom w-100" style="background:var(--saffron);" onclick="addFollowup()">Save Reminder</button>
                    </div>
                    <div class="custom-card p-3" id="followupHistoryList" style="max-height: 500px; overflow-y: auto;"></div>
                </div>

                <div class="tab-pane fade" id="sub-sales">

                                    <option value="जिरे 100 ग्रॅम">जिरे 100 ग्रॅम</option>

                                    <option value="अंगाचे साबण">अंगाचे साबण</option>
                                    <option value="खोबरेल तेल 250ml">खोबरेल तेल 250ml</option>
                                    <option value="पेस्ट 100 ग्रॅम">पेस्ट 100 ग्रॅम</option>

                                    <option value="मसाला 100 ग्रॅम">मसाला 100 ग्रॅम</option>
                                    <option value="अगरबत्ती 150 ग्रॅम">अगरबत्ती 150 ग्रॅम</option>
                                    <option value="हेल्थ गार्ड राईस ब्रॅन ऑईल 1500 gm">हेल्थ गार्ड राईस ब्रॅन ऑईल 1500 gm</option>
                                    <option value="टॉयलेट क्लिनर">टॉयलेट क्लिनर</option>
                                    <option value="टूथब्रश">टूथब्रश</option>
                                    <option value="शॅम्पू 80ml">शॅम्पू 80ml</option>
                                    <option value="न्यूट्रिलाइट">न्यूट्रिलाइट</option>

                                    <option value="वॉशिंग पावडर 1 किलो">वॉशिंग पावडर 1 किलो</option>
                                    <option value="साबण 110 ग्रॅम">साबण 110 ग्रॅम</option>
                                    <option value="ग्लास क्लिनर 500ml">ग्लास क्लिनर 500ml</option>
                                    <option value="फरशी क्लिनर 500ml">फरशी क्लिनर 500ml</option>
                                    <option value="पंचतुलसी ड्रॉप 30ml">पंचतुलसी ड्रॉप 30ml</option>
                                    <option value="फुट केअर क्रीम 50 ग्रॅम">फुट केअर क्रीम 50 ग्रॅम</option>
                                    <option value="बॉडी लोशन 200ml">बॉडी लोशन 200ml</option>
                                    <option value="हँड वॉश 300ml">हँड वॉश 300ml</option>

                            </div>
                            <div class="col-6">
                                <label class="form-label">तारीख:</label>
                                <input type="date" id="saleDate" class="form-control">

                            <div class="col-6 d-flex align-items-end">

            </div>

        <div id="masterReportsArea" style="display:none;">
            <div class="custom-card p-5 text-center">
                <h3 class="mb-4 text-primary">डेटा डाउनलोड</h3>
                <div class="d-flex justify-content-center gap-3 mb-4">
                    <button class="btn btn-success btn-lg shadow" onclick="downloadExcel()"><i class="fas fa-file-excel me-2"></i> Excel</button>
                    <button class="btn btn-danger btn-lg shadow" onclick="downloadPDF()"><i class="fas fa-file-pdf me-2"></i> PDF</button>
                </div>
            </div>
            <table class="table d-none" id="exportTable"><thead><tr><th>Abhiyan</th><th>Name</th><th>Village</th><th>Mobile</th><th>Proposer</th><th>Sales</th></tr></thead><tbody id="exportTableBody"></tbody></table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCny9svhGUs3Ja5OrTHfH5Kqj05GW2S0RE",
      authDomain: "dsworldcrm.firebaseapp.com",
      projectId: "dsworldcrm",
      storageBucket: "dsworldcrm.firebasestorage.app",
      messagingSenderId: "449729131508",
      appId: "1:449729131508:web:61cdd1de17b151717c3fa1"
    };
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.firestore();
    const DOC_ID = "mainData"; const COL_NAME = "crm_data"; 

    let db = { currentProject: 'health', projects: { 'health': { title: 'आरोग्य अभियान', people: [], followups: [], sales: [] }, 'anemia': { title: 'ॲनिमिया मुक्त', people: [], followups: [], sales: [] }, 'water': { title: 'जलसंचय', people: [], followups: [], sales: [] }, 'network': { title: 'नेटवर्क', people: [], followups: [], sales: [] } } };
    let editIndex = null;

    window.onload = function() { document.getElementById('saleDate').valueAsDate = new Date(); loadFromFirebase(); };

    function loadFromFirebase() {
        dbRef.collection(COL_NAME).doc(DOC_ID).get().then((doc) => {
            if (doc.exists) { db = doc.data(); } else { saveToFirebase(); }
            updateStatus("Online");
        }).catch((error) => { updateStatus("Offline"); }).finally(() => {
            document.getElementById('loadingOverlay').style.display = 'none';
            renderCurrentProject(); checkReminders();
        });
    }

    function saveToFirebase() {
        updateStatus("Saving...");
        dbRef.collection(COL_NAME).doc(DOC_ID).set(db).then(() => {
            updateStatus("Online"); renderCurrentProject(); checkReminders();
        }).catch((error) => { updateStatus("Error"); });
    }

    function updateStatus(msg) {
        const badge = document.getElementById('statusBadge'); badge.innerText = msg;
        if(msg==="Online") badge.className = "badge bg-success text-white border px-2 py-1";
        else badge.className = "badge bg-danger text-white border px-2 py-1";
    }

    window.switchProject = function(key) {
        if(key === 'reports') {
            document.getElementById('projectArea').style.display = 'none';
            document.getElementById('masterReportsArea').style.display = 'block';
            renderMasterReport();
        } else {
            document.getElementById('projectArea').style.display = 'block';
            document.getElementById('masterReportsArea').style.display = 'none';
            db.currentProject = key;
            renderCurrentProject();
        }
        document.querySelectorAll('#mainTabs button').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        resetForm();
    }

    window.renderCurrentProject = function() {
        const proj = db.projects[db.currentProject];
        document.getElementById('currentProjectTitle').innerText = proj.title;
        document.getElementById('topTotal').innerText = proj.people.length;
        document.getElementById('topFollow').innerText = proj.followups.length;
        document.getElementById('topSales').innerText = proj.sales.length;

        const tbody = document.getElementById('personTableBody');
        const selF = document.getElementById('followupPersonSelect');
        const selS = document.getElementById('salePersonSelect');
        tbody.innerHTML = ''; selF.innerHTML = '<option value="">-- Select --</option>'; selS.innerHTML = '<option value="">-- Select --</option>';

        proj.people.forEach((p, idx) => {
            let opt = `<option value="${idx}">${p.name} (${p.village})</option>`;
            selF.innerHTML += opt; selS.innerHTML += opt;
        });

        proj.people.map((p, i) => ({...p, oIdx: i})).reverse().forEach(p => {
            tbody.innerHTML += `<tr>
                <td class="fw-bold">${p.name}</td>
                <td>${p.village}</td>
                <td>${p.mobile}</td>
                <td class="text-center">
                    <button class="btn btn-sm btn-warning mb-1" onclick="editPerson(${p.oIdx})"><i class="fas fa-pen"></i></button>
                    <a href="https://wa.me/91${p.mobile}" class="btn btn-sm btn-success mb-1"><i class="fab fa-whatsapp"></i></a>
                    <button class="btn btn-sm btn-danger mb-1" onclick="delPerson(${p.oIdx})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
        });

        const fList = document.getElementById('followupHistoryList'); fList.innerHTML = '';
        proj.followups.slice().reverse().forEach(f => {
            fList.innerHTML += `<div class="p-3 mb-2 bg-light border-start border-4 border-warning rounded"><strong>${f.personName}</strong>: ${f.remark} <span class="float-end text-muted small">${f.entryDate}</span></div>`;
        });

        const sList = document.getElementById('salesList'); sList.innerHTML = '';
        proj.sales.slice().reverse().forEach(s => {
            sList.innerHTML += `<div class="p-3 mb-2 bg-light border-start border-4 border-success rounded"><strong>${s.personName}</strong>: ${s.product} <span class="float-end text-muted small">${s.date}</span></div>`;
        });

        loadImportOptions();
    }

    function loadImportOptions() {
        const select = document.getElementById('importSelect');
        select.innerHTML = '<option value="">-- Smart Import (इतर लिस्ट) --</option>';
        const currentMobiles = db.projects[db.currentProject].people.map(p => String(p.mobile).trim());
        const addedToDropdown = new Set();

        for (const key in db.projects) {
            if (key === db.currentProject) continue;
            db.projects[key].people.forEach(p => {
                const mob = String(p.mobile).trim();
                if (!currentMobiles.includes(mob) && !addedToDropdown.has(mob)) {
                    const pStr = JSON.stringify(p).replace(/"/g, '&quot;');
                    select.innerHTML += `<option value="${pStr}">${p.name} - ${p.village} (${db.projects[key].title})</option>`;
                    addedToDropdown.add(mob);
                }
            });
        }
    }

    window.fillFromImport = function() {
        const val = document.getElementById('importSelect').value;
        if(!val) return;
        const p = JSON.parse(val);
        document.getElementById('pName').value = p.name || '';
        document.getElementById('pMobile').value = p.mobile || '';
        document.getElementById('pVillage').value = p.village || '';
        document.getElementById('pProfession').value = p.profession || '';
        document.getElementById('pProposer').value = p.proposer || '';
        document.getElementById('importSelect').value = "";
    }

    window.addPerson = function() {
        const p = {
            name: document.getElementById('pName').value,
            mobile: document.getElementById('pMobile').value,
            village: document.getElementById('pVillage').value,
            profession: document.getElementById('pProfession').value,
            proposer: document.getElementById('pProposer').value
        };

        if(!p.name || !p.mobile || !p.village) { alert("नाव, मोबाईल, गाव आवश्यक आहे!"); return; }
        
        const existingIdx = db.projects[db.currentProject].people.findIndex(x => String(x.mobile) === String(p.mobile));
        if(existingIdx !== -1 && existingIdx !== editIndex) { alert("मोबाईल नंबर आधीच आहे!"); return; }

        if (editIndex !== null) {
            db.projects[db.currentProject].people[editIndex] = p;
            alert("Updated!");
        } else {
            db.projects[db.currentProject].people.push(p);
            alert("Saved!");
        }
        saveToFirebase(); resetForm();
    }

    window.editPerson = function(idx) {
        const p = db.projects[db.currentProject].people[idx];
        document.getElementById('pName').value = p.name;
        document.getElementById('pMobile').value = p.mobile;
        document.getElementById('pVillage').value = p.village;
        document.getElementById('pProfession').value = p.profession;
        document.getElementById('pProposer').value = p.proposer;
        editIndex = idx;
        const btn = document.getElementById('saveBtn');
        btn.innerText = "UPDATE"; btn.classList.replace('btn-custom','btn-warning');
        document.getElementById('sub-list').scrollIntoView();
    }

    function resetForm() {
        ['pName','pMobile','pVillage','pProfession','pProposer'].forEach(id => document.getElementById(id).value = '');
        editIndex = null;
        const btn = document.getElementById('saveBtn');
        btn.innerText = "SAVE DATA"; btn.classList.replace('btn-warning','btn-custom');
    }

    window.delPerson = function(idx) { if(confirm("Delete?")) { db.projects[db.currentProject].people.splice(idx, 1); saveToFirebase(); } }

    window.addFollowup = function() {
        const idx = document.getElementById('followupPersonSelect').value;
        if(idx === "") { alert("Select Person"); return; }
        const p = db.projects[db.currentProject].people[idx];
        let dates = []; ['fDate1','fDate2','fDate3'].forEach(id => { if(document.getElementById(id).value) dates.push(document.getElementById(id).value); });
        db.projects[db.currentProject].followups.push({ personName: p.name, mobile: p.mobile, proposer: p.proposer, remark: document.getElementById('fRemark').value, dates: dates, entryDate: new Date().toISOString().split('T')[0] });
        saveToFirebase(); alert("Reminder Saved!"); document.getElementById('fRemark').value = '';
    }

    window.addSale = function() {
        const idx = document.getElementById('salePersonSelect').value; const prod = document.getElementById('productSelect').value;
        if(idx === "" || prod === "none") { alert("Select Customer & Product"); return; }
        const p = db.projects[db.currentProject].people[idx]; const date = document.getElementById('saleDate').value;
        let dates = []; let base = new Date(date); const addD = (n) => { let d = new Date(base); d.setDate(base.getDate()+n); return d.toISOString().split('T')[0]; };
        
        // Auto Reminders Logic
        if(prod.includes("5 लिटर") || prod.includes("500ml") || prod.includes("500 ग्रॅम") || prod.includes("1 किलो")) { dates.push(addD(15)); dates.push(addD(25)); }
        else if(prod.includes("nutri") || prod.includes("न्यूट्रिलाइट")) { dates.push(addD(7)); dates.push(addD(15)); dates.push(addD(25)); }
        else { dates.push(addD(5)); }

        db.projects[db.currentProject].followups.push({ personName: p.name, mobile: p.mobile, remark: `Auto: ${prod} Sale`, dates: dates, entryDate: date });
        db.projects[db.currentProject].sales.push({ personName: p.name, product: prod, date });
        saveToFirebase(); alert("Sale Saved!");
    }

    window.checkReminders = function() {
        const today = new Date().toISOString().split('T')[0];
        const list = document.getElementById('reminderList'); const section = document.getElementById('reminderSection');
        list.innerHTML = ''; let hasTask = false;
        for(let k in db.projects) {
            db.projects[k].followups.forEach(f => {
                if(f.dates.includes(today)) { hasTask = true; list.innerHTML += `<span class="badge bg-white text-dark me-1 border p-2 mb-1 d-block text-start">${f.personName}: ${f.remark} <a href="tel:${f.mobile}" class="float-end text-primary"><i class="fas fa-phone"></i></a></span>`; }
            });
        }
        section.style.display = hasTask ? 'block' : 'none';
    }

    window.renderMasterReport = function() {
        const tbody = document.getElementById('exportTableBody'); tbody.innerHTML = '';
        for (const k in db.projects) {
            const pr = db.projects[k];
            pr.people.forEach(p => { let s = pr.sales.filter(x => x.personName === p.name).map(x => x.product).join(', '); tbody.innerHTML += `<tr><td>${pr.title}</td><td>${p.name}</td><td>${p.village}</td><td>${p.mobile}</td><td>${p.proposer}</td><td>${s}</td></tr>`; });
        }
    }
    window.downloadExcel = function() { renderMasterReport(); const wb = XLSX.utils.table_to_book(document.getElementById('exportTable'), {sheet: "Data"}); XLSX.writeFile(wb, "Abhiyan_Data.xlsx"); }
    window.downloadPDF = function() { renderMasterReport(); const element = document.getElementById('exportTable'); element.classList.remove('d-none'); html2pdf().from(element).save(); setTimeout(() => element.classList.add('d-none'), 1000); }
    window.pickContact = async function() { const props = ['name', 'tel']; try { if ('contacts' in navigator && 'select' in navigator.contacts) { const contacts = await navigator.contacts.select(props, { multiple: false }); if(contacts.length > 0) { document.getElementById('pName').value = contacts[0].name[0]; document.getElementById('pMobile').value = contacts[0].tel[0]; } } else { alert("Try Chrome Android"); } } catch (ex) { console.log("Cancelled"); } }
</script>

</body>
